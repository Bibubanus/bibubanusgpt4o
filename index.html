<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ULTIMAI Reasoning Pipeline</title>
  <style>
    body { font-family: monospace; background: #191f23; color: #fff; padding: 32px; }
    h1 { font-size: 2em; color: #b3e14b; }
    pre { background: #222; border-radius: 10px; padding: 24px; font-size: 1.1em; }
  </style>
</head>
<body>
  <h1>ULTIMAI Reasoning Patch</h1>
  <pre id="output">[Загрузка reasoning... Жди пару секунд!]</pre>
  <script>
    // Simple fallback since reasoning_patch.js is missing
    document.addEventListener('DOMContentLoaded', function() {
      const output = document.getElementById('output');
      
      // Try to load reasoning result from the generated markdown file
      fetch('REASONING_RESULT.md')
        .then(response => {
          if (!response.ok) {
            throw new Error('REASONING_RESULT.md not found');
          }
          return response.text();
        })
        .then(text => {
          output.textContent = text;
        })
        .catch(error => {
          output.textContent = `Ошибка загрузки: ${error.message}\n\nПожалуйста, запустите automate_process.py для генерации reasoning данных.`;
        });
    });
  </script>
</body>
</html>
